name: Distribute Play internal

# INF-043 — upload signed AAB to Google Play Console internal testing track.
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Android applicationId (e.g. com.miiptv.tv)
        required: true
        type: string
      aab_path:
        description: Path to signed AAB inside the workspace
        required: false
        type: string
        default: ''
      artifact_name:
        description: Optional workflow artifact name containing the AAB (from INF-041)
        required: false
        type: string
        default: android-tv-release
  workflow_call:
    inputs:
      package_name:
        type: string
        required: true
      aab_path:
        type: string
        required: false
        default: ''
      artifact_name:
        type: string
        required: false
        default: android-tv-release

concurrency:
  group: distribute-play-internal-${{ github.ref }}-${{ inputs.package_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload-internal:
    name: Play internal track
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Play credentials
        id: creds
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play upload (INF-043 Sprint 0)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download package artifact (optional)
        if: steps.creds.outputs.present == 'true' && inputs.aab_path == ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/play
        continue-on-error: true

      - name: Resolve AAB path
        if: steps.creds.outputs.present == 'true'
        id: aab
        env:
          INPUT_AAB: ${{ inputs.aab_path }}
        run: |
          if [ -n "$INPUT_AAB" ] && [ -f "$INPUT_AAB" ]; then
            echo "path=$INPUT_AAB" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FOUND=$(find dist/play -name '*.aab' 2>/dev/null | head -n 1 || true)
          if [ -n "$FOUND" ]; then
            echo "path=$FOUND" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No AAB found. Run INF-041 package workflows first or pass aab_path."
          fi

      - name: Upload to Play internal testing
        if: steps.creds.outputs.present == 'true' && steps.aab.outputs.found == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: internal
          status: completed

      - name: Skip Play upload
        if: steps.creds.outputs.present != 'true' || steps.aab.outputs.found != 'true'
        run: |
          echo "Play internal distribution workflow is defined (INF-043)."
          echo "Requires PLAY_SERVICE_ACCOUNT_JSON and a signed AAB (Play track: internal)."
