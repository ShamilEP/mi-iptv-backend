name: Container image

# INF-005 / INF-041 — build multi-stage non-root image, Trivy-scan, then push to ECR when configured.
# SEC-004 — HIGH/CRITICAL gate + patch SLAs: docs/security/004-dependency-image-vulnerability-policy.md
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tsconfig*.json'
      - '.github/workflows/container-image.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: mi-iptv-backend

jobs:
  build-scan-push:
    name: Build / scan / push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-12)
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            ENV_TAG=prod
          else
            ENV_TAG=dev
          fi
          echo "sha_tag=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "env_tag=${ENV_TAG}" >> "$GITHUB_OUTPUT"
          echo "local_tag=${IMAGE_NAME}:scan" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:scan
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (gate before push)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' && vars.ECR_REGISTRY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        if: ${{ vars.AWS_ROLE_ARN != '' && vars.ECR_REGISTRY != '' }}
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push (scan already passed)
        if: ${{ vars.AWS_ROLE_ARN != '' && vars.ECR_REGISTRY != '' }}
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'mi-iptv-dev-api' }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          ENV_TAG: ${{ steps.meta.outputs.env_tag }}
        run: |
          SRC="${IMAGE_NAME}:scan"
          DST_SHA="${ECR_REGISTRY}/${ECR_REPOSITORY}:${SHA_TAG}"
          DST_ENV="${ECR_REGISTRY}/${ECR_REPOSITORY}:${ENV_TAG}"
          docker tag "$SRC" "$DST_SHA"
          docker tag "$SRC" "$DST_ENV"
          docker push "$DST_SHA"
          docker push "$DST_ENV"
          echo "Pushed ${DST_SHA} and ${DST_ENV} (ECR scan-on-push enabled)."

      - name: Skip push (Sprint 0 mock / unset registry)
        if: ${{ vars.AWS_ROLE_ARN == '' || vars.ECR_REGISTRY == '' }}
        run: |
          echo "Trivy scan passed. Skipping ECR push — set GitHub vars AWS_ROLE_ARN and ECR_REGISTRY to enable publish."
