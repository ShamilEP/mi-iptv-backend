name: PR validation

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint / format / test / OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: OpenAPI vs code
        run: npm run openapi:verify

  apps:
    name: Apps unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run app suites when apps/ workspace exists
        run: |
          if [ -d apps ]; then
            echo "apps/ workspace detected — wire TV/companion unit test commands here."
            exit 1
          fi
          echo "No apps/ tree in mi-iptv-backend."
          echo "Android TV / companion PR validation runs in their repositories (packaging: INF-041)."
