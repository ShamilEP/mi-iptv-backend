name: Distribute TestFlight

# INF-043 — upload signed IPA to TestFlight via App Store Connect API (macOS).
on:
  workflow_dispatch:
    inputs:
      ipa_path:
        description: Path to signed IPA
        required: false
        type: string
        default: ''
      artifact_name:
        description: Optional workflow artifact name containing the IPA (from INF-041)
        required: false
        type: string
        default: companion-ios-ipa
  workflow_call:
    inputs:
      ipa_path:
        type: string
        required: false
        default: ''
      artifact_name:
        type: string
        required: false
        default: companion-ios-ipa

concurrency:
  group: distribute-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload-testflight:
    name: TestFlight upload
    runs-on: macos-latest
    timeout-minutes: 45
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check App Store Connect credentials
        id: creds
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ] || [ -z "$APPLE_API_KEY_P8_BASE64" ] || [ -z "$ASC_APP_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ASC API secrets / ASC_APP_ID missing — skipping TestFlight (INF-043 Sprint 0)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode App Store Connect API key
        if: steps.creds.outputs.present == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          {
            echo 'API_PRIVATE_KEY<<EOF'
            echo "$APPLE_API_KEY_P8_BASE64" | base64 -d
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Download IPA artifact (optional)
        if: steps.creds.outputs.present == 'true' && inputs.ipa_path == ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/testflight
        continue-on-error: true

      - name: Resolve IPA path
        if: steps.creds.outputs.present == 'true'
        id: ipa
        env:
          INPUT_IPA: ${{ inputs.ipa_path }}
        run: |
          if [ -n "$INPUT_IPA" ] && [ -f "$INPUT_IPA" ]; then
            echo "path=$INPUT_IPA" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FOUND=$(find dist/testflight -name '*.ipa' 2>/dev/null | head -n 1 || true)
          if [ -n "$FOUND" ]; then
            echo "path=$FOUND" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No IPA found. Run INF-041 companion IPA packaging first or pass ipa_path."
          fi

      - name: Upload to TestFlight
        if: steps.creds.outputs.present == 'true' && steps.ipa.outputs.found == 'true'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ env.API_PRIVATE_KEY }}
          app-store-id: ${{ secrets.ASC_APP_ID }}

      - name: Skip TestFlight upload
        if: steps.creds.outputs.present != 'true' || steps.ipa.outputs.found != 'true'
        run: |
          echo "TestFlight distribution workflow is defined (INF-043)."
          echo "Requires APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8_BASE64, ASC_APP_ID, and a signed IPA."
          echo "Beta channel: TestFlight (internal → external after Beta App Review)."
